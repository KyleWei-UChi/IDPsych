[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "IDPsych"
version = "2.1.0"
description = "Load, summarize, and plot human psychophysics data from the motion-coherence increment/decrement detection task"
authors = [{ name = "Lai Wei", email = "laiwei@uchicago.edu" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pymatreader",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
include = ["IDPsych*"]

[tool.setuptools.package-data]
IDPsych = ["data/*.json"]
